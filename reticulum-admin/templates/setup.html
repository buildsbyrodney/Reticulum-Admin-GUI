{% extends 'base.html' %}{% block content %}<section class="card narrow"><h1>Secure the administrator</h1><p>Create the first local administrator account. This appears only once.</p><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Username<input name="username" minlength="3" required autocomplete="username"></label><label>Password<input type="password" name="password" minlength="12" required autocomplete="new-password"></label><label>Confirm password<input type="password" name="confirmation" minlength="12" required autocomplete="new-password"></label><button>Create administrator</button></form></section>{% endblock %}
