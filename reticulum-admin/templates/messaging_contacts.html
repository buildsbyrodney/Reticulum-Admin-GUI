{% extends 'base.html' %}{% block content %}<h1>Contacts</h1><p>Contacts are local labels only; saving one does not authenticate or trust a destination.</p><form class="card" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="action" value="save"><label>Name<input name="name" maxlength="100" required></label><label>Destination hash<input name="destination" maxlength="32" required></label><label>Notes<textarea name="notes" maxlength="500"></textarea></label><button>Save Contact</button></form><table><tr><th>Name</th><th>Destination</th><th>Notes</th><th></th></tr>{% for row in rows %}<tr><td>{{ row.name }}</td><td><code>{{ row.destination }}</code></td><td>{{ row.notes or '—' }}</td><td><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="action" value="delete"><input type="hidden" name="destination" value="{{ row.destination }}"><button>Delete</button></form></td></tr>{% endfor %}</table>{% endblock %}
