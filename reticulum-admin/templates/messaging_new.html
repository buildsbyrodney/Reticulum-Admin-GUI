{% extends 'base.html' %}{% block content %}<h1>New Message</h1><form class="card" id="new-message-form" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="message_id" value=""><label>Destination hash or saved contact<select name="destination"><option value="">Enter destination below</option>{% for row in contacts %}<option value="{{ row.destination }}">{{ row.name }} · {{ row.destination }}</option>{% endfor %}</select></label><label>Destination hash<input name="destination_value" maxlength="32" placeholder="32 hexadecimal characters"></label><label>Message<textarea name="body" maxlength="4000" required></textarea></label><p class="muted">Plain text only. Queued means the service accepted your request; it does not confirm delivery.</p><button>Queue Message</button></form><script>(function () { const form = document.getElementById("new-message-form"); if (!form) return; form.addEventListener("submit", function () { const destination = (form.elements.destination.value || form.elements.destination_value.value || "").trim().toLowerCase(); const body = form.elements.body.value; if (!/^[0-9a-f]{32}$/.test(destination) || !body.trim()) return; const id = window.crypto && crypto.randomUUID ? crypto.randomUUID().replace(/-/g, "") : Array.from({length: 32}, () => Math.floor(Math.random() * 16).toString(16)).join(""); form.elements.message_id.value = id; try { sessionStorage.setItem("reticulum-admin-pending-" + destination, JSON.stringify({id: id, direction: "outbound", body: body, timestamp: "Just now", delivery_state: "Pending"})); } catch (_) {} }); }());</script>{% endblock %}
