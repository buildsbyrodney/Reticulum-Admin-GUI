{% extends 'base.html' %}{% block content %}<h1>New Message</h1><form class="card" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Destination hash or saved contact<select name="destination"><option value="">Enter destination below</option>{% for row in contacts %}<option value="{{ row.destination }}">{{ row.name }} · {{ row.destination }}</option>{% endfor %}</select></label><label>Destination hash<input name="destination_value" maxlength="32" placeholder="32 hexadecimal characters"></label><label>Message<textarea name="body" maxlength="4000" required></textarea></label><p class="muted">Plain text only. Queued means the service accepted your request; it does not confirm delivery.</p><button>Queue Message</button></form>{% endblock %}
