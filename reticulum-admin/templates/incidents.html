{% extends 'base.html' %}{% block content %}<h1>Incident History</h1><table><thead><tr><th>ID</th><th>Start</th><th>Admin</th><th>Target</th><th>Actions</th><th>Status</th></tr></thead><tbody>{% for row in rows %}<tr><td>{{ row.id }}</td><td>{{ format_time(row.started_at) }}</td><td>{{ row.admin }}</td><td>{{ row.target_json }}</td><td>{{ row.actions_json }}</td><td>{{ row.status }}</td></tr>{% else %}<tr><td colspan="6">No incidents recorded.</td></tr>{% endfor %}</tbody></table>{% endblock %}
