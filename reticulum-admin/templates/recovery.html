{% extends 'base.html' %}{% block content %}<h1>Incident Recovery</h1><p>Choose only the cleanup actions needed. Blackholing applies to this operator's Reticulum network segments, not globally. IP addresses are not identities unless Reticulum explicitly proves it.</p><form class="card" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Identity hash for blackhole<input name="identity" maxlength="32"></label><label>Transport identity for drop-via<input name="transport" maxlength="32"></label><label>Destination hash<input name="destination" maxlength="32"></label><label>Affected interface<input name="interface" maxlength="100"></label><label>Duration in hours (blank = permanent)<input name="duration"></label><label>Reason<input name="reason" maxlength="240"></label><h2>Actions</h2><label><input type="checkbox" name="blackhole" {% if not capabilities.blackhole %}disabled{% endif %}> Blackhole identity</label><label><input type="checkbox" name="drop_via" {% if not capabilities.drop_via_transport %}disabled{% endif %}> Drop all paths via transport</label><label><input type="checkbox" name="drop_announces" {% if not capabilities.drop_announces %}disabled{% endif %}> Drop all queued announces (broad local cleanup)</label><label><input type="checkbox" name="attach" {% if not capabilities.attach_interface %}disabled{% endif %}> Attach interface</label><label><input type="checkbox" name="detach" {% if not capabilities.detach_interface %}disabled{% endif %}> Detach interface (typed confirmation required)</label><label><input type="checkbox" name="reload" {% if not capabilities.reload_interface %}disabled{% endif %}> Reload interface</label><button>Review recovery</button></form>{% endblock %}
