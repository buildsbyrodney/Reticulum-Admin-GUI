{% extends 'base.html' %}{% block content %}<h1>Logs</h1><form class="filters" method="get"><input name="q" value="{{ request.args.get('q','') }}" placeholder="Search recent log lines"><select name="severity"><option value="">All levels</option>{% for s in ['error','warning','notice','info'] %}<option value="{{ s }}" {% if request.args.get('severity') == s %}selected{% endif %}>{{ s }}</option>{% endfor %}</select><button>Filter</button></form><pre class="logs">{% for line in lines %}{{ line }}
{% else %}No readable Reticulum logfile is available yet.{% endfor %}</pre>{% endblock %}
