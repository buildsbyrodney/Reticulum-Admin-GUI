name: Validate
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify generated KJV library against canonical source
        run: node scripts/generate-kjv-library.mjs --check
      - run: python -m pip install -r reticulum-admin/requirements.txt
      - run: python -m unittest discover -s tests
      - run: python -c "from pathlib import Path; [compile(p.read_text(), str(p), 'exec') for p in Path('.').glob('**/*.py') if '.git' not in p.parts]"
      - run: bash -n install.sh scripts/*.sh rnsd/start-rnsd.sh tests/test_installer_release.sh
      - run: ./tests/test_installer_release.sh
      - name: Validate Compose host-network configuration
        run: ADMIN_SECRET_KEY=test MANAGEMENT_TOKEN=test docker compose config >/dev/null
      - name: Verify Discovery-enabled rnsd becomes ready
        run: |
          chmod +x tests/test_discovery_runtime.sh
          ./tests/test_discovery_runtime.sh
      - name: Verify Pi-scale shared-instance readiness window
        run: |
          chmod +x tests/test_rnsd_readiness_window.sh
          ./tests/test_rnsd_readiness_window.sh
      - name: Build and inspect release archive
        run: |
          chmod +x scripts/build-release.sh
          ./scripts/build-release.sh
          (cd release && sha256sum -c *.sha256)
          if find . -path './.git' -prune -o -path './release' -prune -o -type f \( -name '*.sh' -o -name '*.py' \) -exec grep -Il $'\r' {} + | grep -q .; then
            echo 'CRLF line ending found in an executable script.' >&2
            exit 1
          fi
          tar -tvzf release/*.tar.gz | awk '$NF ~ /\/install\.sh$/ { found=1; if (substr($1, 4, 1) != "x") exit 1 } END { exit found ? 0 : 1 }'
          tar -tzf release/*.tar.gz | grep -Eq '/lxmf-messaging/messaging\.py$'
          tar -tzf release/*.tar.gz | grep -Eq '/reticulum-admin/templates/messaging\.html$'
          tar -tzf release/*.tar.gz | grep -Eq '/reticulum-admin/templates/topology\.html$'
          tar -tzf release/*.tar.gz | grep -Eq '/reticulum-admin/static/app\.css$'
          tar -tzf release/*.tar.gz | grep -Eq '/tests/test_network_map\.py$'
