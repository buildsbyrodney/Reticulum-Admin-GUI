name: Validate
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest tests/test_management.py
      - run: python -c "from pathlib import Path; [compile(p.read_text(), str(p), 'exec') for p in Path('.').glob('**/*.py') if '.git' not in p.parts]"
      - run: bash -n install.sh scripts/*.sh rnsd/start-rnsd.sh
      - run: chmod +x scripts/build-release.sh && ./scripts/build-release.sh && (cd release && sha256sum -c *.sha256)
