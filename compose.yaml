services:
  rnsd:
    build:
      context: ./rnsd
      args:
        RNS_VERSION: ${RNS_VERSION:-1.5.7}
    restart: unless-stopped
    environment:
      SERVER_TIMEZONE: ${SERVER_TIMEZONE:-America/Chicago}
      RETICULUM_ADMIN_VERSION: ${RETICULUM_ADMIN_VERSION:-0.3.9}
      HOST_ARCH: ${HOST_ARCH:-unknown}
      HOST_OS: ${HOST_OS:-unknown}
      INSTALL_DOCKER_VERSION: ${INSTALL_DOCKER_VERSION:-unknown}
      INSTALL_COMPOSE_VERSION: ${INSTALL_COMPOSE_VERSION:-unknown}
      EVENT_RETENTION_DAYS: ${EVENT_RETENTION_DAYS:-90}
      OBSERVER_INTERVAL: ${OBSERVER_INTERVAL:-30}
      RNSD_SNAPSHOT_MAX_AGE: ${RNSD_SNAPSHOT_MAX_AGE:-45}
    volumes:
      # Reticulum keeps its config, identities, storage, and service logs here.
      - ./data/reticulum:/root/.reticulum
    healthcheck:
      # Reads the observer snapshot only; it verifies the local shared instance,
      # not merely that the launcher loop is alive.
      test: ["CMD", "python", "/usr/local/bin/check-rnsd-health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 90s

  management-agent:
    build:
      context: ./management-agent
    restart: unless-stopped
    environment:
      MANAGEMENT_TOKEN: ${MANAGEMENT_TOKEN:?Set MANAGEMENT_TOKEN in .env}
      RETICULUM_ADMIN_VERSION: ${RETICULUM_ADMIN_VERSION:-0.3.9}
      RETICULUM_DIR: /reticulum
      # Observer-based health and this bounded restart budget fit inside the explicit
      # 90-second agent worker and 100-second web request budgets.
      RESTART_HEALTH_TIMEOUT: ${RESTART_HEALTH_TIMEOUT:-35}
      INTERFACE_HEALTH_TIMEOUT: ${INTERFACE_HEALTH_TIMEOUT:-10}
      CONTROL_OPERATION_TIMEOUT: ${CONTROL_OPERATION_TIMEOUT:-25}
    volumes:
      # The management agent is the sole config writer. The web UI remains read-only.
      - ./data/reticulum:/reticulum
    networks: [management]

  reticulum-admin:
    build: ./reticulum-admin
    restart: unless-stopped
    depends_on:
      rnsd:
        condition: service_started
    environment:
      ADMIN_SECRET_KEY: ${ADMIN_SECRET_KEY:?Set ADMIN_SECRET_KEY in .env}
      RETICULUM_DIR: /reticulum
      ADMIN_ACCESS_MODE: ${ADMIN_ACCESS_MODE:-local}
      SERVER_TIMEZONE: ${SERVER_TIMEZONE:-America/Chicago}
      MANAGEMENT_URL: http://management-agent:8081
      MANAGEMENT_TOKEN: ${MANAGEMENT_TOKEN:?Set MANAGEMENT_TOKEN in .env}
      RETICULUM_ADMIN_VERSION: ${RETICULUM_ADMIN_VERSION:-0.3.9}
      HOST_ARCH: ${HOST_ARCH:-unknown}
      HOST_OS: ${HOST_OS:-unknown}
      INSTALL_DOCKER_VERSION: ${INSTALL_DOCKER_VERSION:-unknown}
      INSTALL_COMPOSE_VERSION: ${INSTALL_COMPOSE_VERSION:-unknown}
      MANAGEMENT_HTTP_TIMEOUT: ${MANAGEMENT_HTTP_TIMEOUT:-100}
      MANAGEMENT_PREVIEW_TIMEOUT: ${MANAGEMENT_PREVIEW_TIMEOUT:-5}
    ports:
      - "${ADMIN_BIND_ADDRESS:-127.0.0.1}:${ADMIN_PORT:-8740}:8000"
    volumes:
      # Read-only by design: the GUI cannot modify Reticulum in this release.
      - ./data/reticulum:/reticulum:ro
      - ./data/admin:/var/lib/reticulum-admin
    networks: [default, management]

networks:
  management:
    internal: true
