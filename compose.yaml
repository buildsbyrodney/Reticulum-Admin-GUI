services:
  rnsd:
    build:
      context: ./rnsd
      args:
        RNS_VERSION: ${RNS_VERSION:-1.5.7}
        LXMF_VERSION: ${LXMF_VERSION:-0.9.6}
    restart: unless-stopped
    # rnsd must see the Linux host's real LAN and Tailscale interfaces. It has
    # no Docker-published ports; Reticulum binds only the interface addresses
    # and ports validated/configured by the operator.
    network_mode: host
    environment:
      SERVER_TIMEZONE: ${SERVER_TIMEZONE:-America/Chicago}
      RETICULUM_ADMIN_VERSION: ${RETICULUM_ADMIN_VERSION:-0.9.3}
      HOST_ARCH: ${HOST_ARCH:-unknown}
      HOST_OS: ${HOST_OS:-unknown}
      INSTALL_DOCKER_VERSION: ${INSTALL_DOCKER_VERSION:-unknown}
      INSTALL_COMPOSE_VERSION: ${INSTALL_COMPOSE_VERSION:-unknown}
      EVENT_RETENTION_DAYS: ${EVENT_RETENTION_DAYS:-90}
      OBSERVER_INTERVAL: ${OBSERVER_INTERVAL:-30}
      RNSD_SNAPSHOT_MAX_AGE: ${RNSD_SNAPSHOT_MAX_AGE:-45}
    volumes:
      # Reticulum keeps its config, identities, storage, and service logs here.
      - ./data/reticulum:/root/.reticulum
    healthcheck:
      # Reads the observer snapshot only; it verifies the local shared instance,
      # not merely that the launcher loop is alive.
      test: ["CMD", "python", "/usr/local/bin/check-rnsd-health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 90s

  management-agent:
    build:
      context: ./management-agent
    restart: unless-stopped
    environment:
      MANAGEMENT_TOKEN: ${MANAGEMENT_TOKEN:?Set MANAGEMENT_TOKEN in .env}
      RETICULUM_ADMIN_VERSION: ${RETICULUM_ADMIN_VERSION:-0.9.3}
      RETICULUM_DIR: /reticulum
      # One Pi candidate can fail and be relaunched before it owns the shared
      # instance. A full apply and a possible verified rollback fit inside the
      # explicit 170-second agent and 180-second web request budgets.
      RESTART_HEALTH_TIMEOUT: ${RESTART_HEALTH_TIMEOUT:-70}
      INTERFACE_HEALTH_TIMEOUT: ${INTERFACE_HEALTH_TIMEOUT:-10}
      CONTROL_OPERATION_TIMEOUT: ${CONTROL_OPERATION_TIMEOUT:-25}
    volumes:
      # The management agent is the sole config writer. The web UI remains read-only.
      - ./data/reticulum:/reticulum
    networks: [management]

  reticulum-admin:
    build: ./reticulum-admin
    restart: unless-stopped
    depends_on:
      rnsd:
        condition: service_started
    environment:
      ADMIN_SECRET_KEY: ${ADMIN_SECRET_KEY:?Set ADMIN_SECRET_KEY in .env}
      RETICULUM_DIR: /reticulum
      ADMIN_ACCESS_MODE: ${ADMIN_ACCESS_MODE:-local}
      SERVER_TIMEZONE: ${SERVER_TIMEZONE:-America/Chicago}
      MANAGEMENT_URL: http://management-agent:8081
      MANAGEMENT_TOKEN: ${MANAGEMENT_TOKEN:?Set MANAGEMENT_TOKEN in .env}
      RETICULUM_ADMIN_VERSION: ${RETICULUM_ADMIN_VERSION:-0.9.3}
      HOST_ARCH: ${HOST_ARCH:-unknown}
      HOST_OS: ${HOST_OS:-unknown}
      INSTALL_DOCKER_VERSION: ${INSTALL_DOCKER_VERSION:-unknown}
      INSTALL_COMPOSE_VERSION: ${INSTALL_COMPOSE_VERSION:-unknown}
      MANAGEMENT_HTTP_TIMEOUT: ${MANAGEMENT_HTTP_TIMEOUT:-180}
      MANAGEMENT_PREVIEW_TIMEOUT: ${MANAGEMENT_PREVIEW_TIMEOUT:-5}
    ports:
      - "${ADMIN_BIND_ADDRESS:-127.0.0.1}:${ADMIN_PORT:-8740}:8000"
    volumes:
      # Read-only by design: the GUI cannot modify Reticulum in this release.
      - ./data/reticulum:/reticulum:ro
      - ./data/admin:/var/lib/reticulum-admin
      - ./data/bot-status:/bot-status:ro
      - ./data/bot-config:/bot-config
      - ./data/messaging:/messaging:ro
      - ./data/messaging-requests:/messaging-requests
      - ./data/nomad:/nomad:ro
      - ./data/nomad-requests:/nomad-requests
    networks: [default, management]

  lxmf-test-bot:
    build: ./lxmf-test-bot
    restart: unless-stopped
    depends_on:
      rnsd:
        condition: service_started
    # Reticulum's local shared-instance socket is namespace-local. The bot
    # must share rnsd's host network namespace to attach as a client, but it
    # publishes no ports and still has only a read-only Reticulum mount.
    network_mode: host
    environment:
      BOT_STATE_DIR: /bot
      BOT_STATUS_DIR: /status
      BOT_CONFIG_DIR: /config
    volumes:
      # The bot can join the existing Reticulum shared instance but cannot
      # modify its configuration. Its own identity and settings are isolated.
      - ./data/reticulum:/reticulum:ro
      - ./data/bot:/bot
      - ./data/bot-status:/status
      - ./data/bot-config:/config

  lxmf-messaging:
    build: ./lxmf-messaging
    restart: unless-stopped
    depends_on:
      rnsd:
        condition: service_started
    # The local Reticulum shared-instance socket is namespace-local. This
    # service publishes no ports and has only a read-only Reticulum mount.
    network_mode: host
    environment:
      MESSAGING_STATE_DIR: /messaging
      MESSAGING_REQUEST_DIR: /requests
      WEB_PUSH_VAPID_SUBJECT: ${WEB_PUSH_VAPID_SUBJECT:-}
    volumes:
      - ./data/reticulum:/reticulum:ro
      - ./data/messaging:/messaging
      - ./data/messaging-requests:/requests

  nomad-browser:
    build: ./nomad-browser
    restart: unless-stopped
    depends_on:
      rnsd:
        condition: service_started
    # Nomad pages use Reticulum Link requests. Like the Messaging and Bot
    # clients, this has host networking solely to attach to the existing local
    # shared instance; it publishes no ports and cannot run its own master.
    network_mode: host
    environment:
      NOMAD_STATE_DIR: /nomad
      NOMAD_REQUEST_DIR: /requests
      # A multi-hop Nomad page can arrive as an RNS Resource, which needs its
      # own local assembly area. This remains bounded and is separate from
      # the managed rnsd state.
      NOMAD_REQUEST_TIMEOUT_SECONDS: ${NOMAD_REQUEST_TIMEOUT_SECONDS:-45}
    volumes:
      - ./data/reticulum:/reticulum:ro
      # Keep Reticulum configuration and the shared-instance socket read-only.
      # These two writable overlays are only this Browser client's transient
      # Resource assembly and ratchet state.
      - ./data/nomad/reticulum-storage/resources:/reticulum/storage/resources
      - ./data/nomad/reticulum-storage/ratchets:/reticulum/storage/ratchets
      - ./data/nomad:/nomad
      - ./data/nomad-requests:/requests

networks:
  management:
    internal: true
